services:

  postgres:
    image: postgres:15-alpine
    container_name: dcms_postgres
    restart: always
    environment:
      POSTGRES_USER: dcms_user
      POSTGRES_PASSWORD: dcms_secure_password
      POSTGRES_DB: dcms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms_user -d dcms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dcms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: chrislusf/seaweedfs:latest
    container_name: dcms_minio
    restart: always
    ports:
      - "9000:8333"
    command: server -s3 -dir=/data
    volumes:
      - miniodata:/data

  postgres_test:
    image: postgres:15
    container_name: dcms_postgres_test
    environment:
      POSTGRES_USER: dcms_user
      POSTGRES_PASSWORD: dcms_password
      POSTGRES_DB: dcms_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms_user -d dcms_test"]
      interval: 3s
      timeout: 3s
      retries: 10
      
volumes:
  pgdata:
  redisdata:
  miniodata:
